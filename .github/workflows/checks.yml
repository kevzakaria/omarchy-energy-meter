# Cheap, dependency-free checks. Nothing here installs a package: the runner
# already has bash, git and python3, and an installer step would be one more
# thing that can break for a reason unrelated to this repository.
#
# .github/ is outside the Omarchy marketplace security scanner's scope, so a
# workflow file cannot change the plugin's reported capability set.
name: checks

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # scripts/check-docs.sh uses `git grep`, which needs the work tree
          # and nothing else; one commit is enough.
          fetch-depth: 1

      - name: Documentation matches what is shipped
        run: ./scripts/check-docs.sh

      - name: Managed paths refuse symlinks
        # Runtime half of the marketplace symlink finding. Isolated XDG
        # home, no RAPL / GPU / systemd / network; scripts/check-docs.sh
        # audit 4 is the static half.
        run: ./scripts/check-path-safety.sh

      - name: Tightening permissions does not unlock SQLite
        # Regression guard for issue #2: the daemon took SIGBUS in a WAL
        # checkpoint after the permission pass cancelled its own POSIX locks.
        # Reads /proc/locks; needs no RAPL, GPU, systemd or network.
        run: ./scripts/check-sqlite-locks.sh

      - name: CLI compiles
        run: python3 -m py_compile bin/omaenergy
